name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time (they share the OpenTofu state).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # The S3 state backend uses the same Scaleway API key.
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_app_password: ${{ secrets.APP_PASSWORD }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu init
        run: tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # The registry has to exist before the first image can be pushed to it.
      - name: Create registry
        run: tofu apply -input=false -auto-approve -target=scaleway_registry_namespace.main

      - name: Read registry address
        id: registry
        run: |
          endpoint="$(tofu output -raw registry_endpoint)"
          echo "host=${endpoint%%/*}" >> "$GITHUB_OUTPUT"
          echo "image=$(tofu output -raw image_repository)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:${{ github.sha }}
            ${{ steps.registry.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        run: tofu apply -input=false -auto-approve -var="image_tag=${{ github.sha }}"

      - name: Show app URL
        run: echo "### App deployed to $(tofu output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
