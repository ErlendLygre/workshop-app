# Local development: runs the app and a PostgreSQL database.
# Start with: docker compose up --build   →   http://localhost:8080 (password: dev-password)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=library;Username=library;Password=library"
      APP_PASSWORD: dev-password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
